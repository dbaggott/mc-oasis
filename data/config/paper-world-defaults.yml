# Paper settings for every world: each puts back vanilla behavior Paper
# changes, except where its comment says otherwise.
#
# No _version: Paper takes a file without one to be at the current version.

collisions:
  allow-player-cramming-damage: true
  max-entity-collisions: 2147483647
entities:
  behavior:
    only-merge-items-horizontally: true
    # A villager a zombie kills always turns into a zombie villager, as on Hard,
    # instead of half the time on Normal.
    zombie-villager-infection-chance: 100
  spawning:
    # Entities with duplicate UUIDs are left alone, as in vanilla, and logged.
    duplicate-uuid:
      mode: WARN
    max-arrow-despawn-invulnerability: disabled
hopper:
  cooldown-when-full: false
misc:
  allow-remote-ender-dragon-respawning: true
