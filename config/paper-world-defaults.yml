# Paper settings for every world, where they differ from Paper's own defaults:
# each one puts back the vanilla behavior Paper changes. Copied over the live
# file at every start; Paper fills in everything else and saves it back.
#
# No _version: Paper takes a file without one to be at the current version.

collisions:
  allow-player-cramming-damage: true
  max-entity-collisions: 2147483647
entities:
  behavior:
    only-merge-items-horizontally: true
  spawning:
    max-arrow-despawn-invulnerability: disabled
hopper:
  cooldown-when-full: false
misc:
  allow-remote-ender-dragon-respawning: true
