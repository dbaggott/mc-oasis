name: OasisTechnoblade
version: 1.0.0
main: com.oasissmp.technoblade.OasisTechnoblade
api-version: '26.3'
description: Technoblade, the one pig in the overworld that never stays dead, and /technoblade for staff
depend: [WorldGuard, WorldEdit]
# Loaded first when present, so the Bedrock crown is set up before Geyser enables.
softdepend: [Geyser-Spigot]
permissions:
  oasistechnoblade.manage:
    description: See where Technoblade is and place a new one with /technoblade
    default: false
