# Technoblade's crown, the item display OasisTechnoblade mounts on the pig.
# Riding, the Bedrock entity is drawn from the pig's origin, at its feet, and
# the crown's Bedrock geometry (resourcepack-bedrock/) is laid out from there,
# so the extension's default half-block drop is undone here.
mappings:
  technoblade_crown:
    type: "minecraft:golden_helmet"
    item-identifier: "oasis:technoblade_crown"
    displayentityoptions:
      y-offset: 0
      vanilla-scale: false
      vanilla-scale-multiplier: 1
      hand: false
