# Graves' defaults, except that it never reaches the internet on its own: no
# update check, and /graves dump writes to a file rather than uploading to a
# paste site. Graves reads each key this file leaves out from the defaults in
# its jar, and moves aside a file whose config-version is older than its own.
config-version: 3
settings:
  update:
    check: false
  dump:
    method: FILE
