# Graves' defaults, except that it doesn't check for updates, and /graves
# dump writes to a file rather than uploading to a paste site. Its bStats
# metrics can't be turned off from here. Graves reads each key this file leaves
# out from the defaults in its jar. If its jar's config-version is newer than
# this file's, it moves the whole config folder aside and runs on its jar's
# defaults, graves anyone can open among them; the smoke test fails on that.
config-version: 3
settings:
  update:
    check: false
  dump:
    method: FILE
