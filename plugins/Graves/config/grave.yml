# Graves' defaults, except who can open a grave, which is stated here in full,
# when one expires and what happens then, and how a player gets back to it.
# Graves reads each key this file leaves out from the defaults in its jar.
#
# A grave can be opened or broken only by the player who died, and by anyone
# with graves.bypass: ops, so owners, who can recover a player's items. No
# zombie is spawned when someone other than the owner loots one. A grave stays
# protected for as long as it lasts; after 6 days it expires and drops its
# items where it stood, for anyone to pick up. The time runs from the death,
# while the server is stopped too, so it has to outlast days nobody plays.
#
# Players walk back to their grave: there is no economy plugin to charge for
# teleporting, so the /graves menu's teleport would be free from anywhere, and
# it's off. No compass to the grave is given on respawning either.
settings:
  default:
    default:
      grave:
        time: 518400
      drop:
        timeout: true
      protection:
        enabled: true
        time: -1
        open:
          owner: true
          killer: false
          other: false
          missing:
            owner: true
            other: false
      teleport:
        enabled: false
      respawn:
        compass: false
      zombie:
        spawn-other: false
