# Every player. The plugin list is hidden. ClickVillagers is pickup-and-place
# and trade resetting only: each of its other features is a permission it
# grants everyone by default. Its config is the repo's, so no one, op or not,
# edits it in game.
#
# Simple Voice Chat means its listen, speak and groups permissions for
# everyone, but its plugin.yml declares them with no default, which Bukkit
# registers as ops-only, and LuckPerms answers from that registration. So
# they're granted here.
name: default
permissions:
- bukkit.command.plugins:
    value: false
- clickvillagers.anchor:
    value: false
- clickvillagers.change-biome:
    value: false
- clickvillagers.claim:
    value: false
- clickvillagers.config:
    value: false
- clickvillagers.hopper:
    value: false
- clickvillagers.partner:
    value: false
- voicechat.groups
- voicechat.listen
- voicechat.speak
