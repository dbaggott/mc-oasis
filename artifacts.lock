# Every third-party file baked into the image: what it is, where it comes from,
# and the sha256 it must have. scripts/fetch-artifacts.sh downloads each one
# and fails the build on any mismatch, so a changed upstream file can't reach
# the server unreviewed.
#
# One artifact per line, whitespace-separated:
#   <kind> <name> <version> <sha256> <url>
#
# kind      server (the one Paper jar) | plugin | datapack | library
# name      for a plugin, the name it declares and the server reports. The
#           smoke test requires a plugin by this name to enable, and its config
#           folder under plugins/ is this name too.
#           For a datapack, the file name in the world's datapacks folder. A new
#           world enables them in name order, and a later pack overrides an
#           earlier one wherever both define the same file, so the numeric
#           prefix sets precedence: the Dungeons and Taverns overhauls sit
#           above the main pack, and the enchant disabler above all of them.
#           Only for a new world: a pack added to an existing one is enabled
#           above all the rest, whatever its prefix.
#           For a library, any name: libraries are what the repo's own plugins
#           in plugin-src/ compile against, and none of them goes in the image.
#
# Removing a worldgen datapack (Tectonic, Dungeons and Taverns and its
# overhauls) from an existing world breaks the terrain and structures it
# generated. Add them only before the world is first generated.
#
# Changing a line is a version bump: update version, sha256 and url together.

