################################################################################
# Mirror Lambda Adapter — copy one release of the Lambda Web Adapter image from
# ECR Public, its only upstream registry, to this account's GHCR namespace.
#
# api/Dockerfile copies the adapter out of that image. Pulled anonymously from
# ECR Public, the build fails whenever the runner's shared IP has used up its
# quota there (429 "Data limit exceeded"), and logging in is not an option: the
# `api` job runs on pull requests from forks, which get no AWS credentials. GHCR
# serves a public image to anyone, without logging in.
#
# The copy keeps upstream's digest, so a digest pinned from it is the one ECR
# Public serves, and anyone can check the mirror against upstream.
#
# To move to a new adapter release: dispatch this with its version, then point
# api/Dockerfile at the tag and the digest the run prints.
################################################################################

name: Mirror Lambda Adapter

on:
  workflow_dispatch:
    inputs:
      version:
        description: Adapter release to copy, as tagged on ECR Public (e.g. 1.0.1)
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      VERSION: ${{ inputs.version }}
      SOURCE: public.ecr.aws/awsguru/aws-lambda-adapter
      DEST: ghcr.io/${{ github.repository_owner }}/aws-lambda-adapter
    steps:
      - name: Copy the image
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like 1.0.1, got: $VERSION"
            exit 1
          fi
          # --preserve-digests fails the copy rather than push a different
          # digest, so the one written to the digest file is upstream's.
          skopeo copy --all --preserve-digests --retry-times 5 \
            --dest-creds "${GH_ACTOR}:${GH_TOKEN}" \
            --digestfile "$RUNNER_TEMP/digest" \
            "docker://${SOURCE}:${VERSION}" "docker://${DEST}:${VERSION}"

          digest="$(cat "$RUNNER_TEMP/digest")"
          echo "Pin in api/Dockerfile: ${DEST}:${VERSION}@${digest}" | tee -a "$GITHUB_STEP_SUMMARY"
