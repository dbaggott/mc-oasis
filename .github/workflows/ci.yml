################################################################################
# CI — fetch and verify every artifact, build the arm64 server image, and smoke
# test it. Outside pull requests, push it to ECR as <sanitized-branch>_<sha>.
#
# PUSHING IS NOT DEPLOYING. `apps/app deploy mc-oasis <branch>` in
# dbaggott/infrastructure records an image for the server, which runs it from
# its next start. AWS_ROLE_ARN, AWS_REGION and ECR_REGISTRY are repo variables
# set from there (accounts/github/mc_oasis_ci.tf).
#
# Third-party actions are pinned to commit SHAs: this repo is public, and a
# moved tag would run someone else's code with this workflow's permissions.
################################################################################

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Pushes a branch's build, for `apps/app deploy mc-oasis <branch>`.
  # Dispatchable once this file is on the default branch; a dispatched run uses
  # the chosen branch's copy, push job included, so anyone who can push a branch
  # decides what runs with the push role.
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR supersedes the run in flight for it. Every other run gets a
# group of its own commit, since each pushes a distinct image.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # The server runs on Graviton, so the image is built and tested natively.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
          shellcheck scripts/*.sh

      - name: Fetch and verify artifacts
        run: scripts/fetch-artifacts.sh

      - name: Build
        run: docker build --platform linux/arm64 --tag mc-oasis:ci .

      - name: Smoke test
        run: |
          command -v jq >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q jq; }
          scripts/smoke-test.sh mc-oasis:ci

      # Handed to the push job as a file, so what gets pushed is the image that
      # was tested here rather than a rebuild of it.
      - name: Save the image
        if: github.event_name != 'pull_request'
        run: docker save mc-oasis:ci | gzip > image.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          name: image
          path: image.tar.gz
          retention-days: 1
          compression-level: 0

  # The only job that can reach AWS. The push role trusts the `ecr-push`
  # environment and nothing else in this repo, and this job must keep running
  # only on push and workflow_dispatch, never on anything a fork can trigger.
  push:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: ecr-push
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image

      - name: Load the image
        run: gunzip --stdout image.tar.gz | docker load

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region "${{ vars.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "${{ vars.ECR_REGISTRY }}"

      - name: Push
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The tag apps/app resolves a branch to, sanitized the same way.
          TAG="$(printf '%s' "$BRANCH" | sed 's/[^a-zA-Z0-9._-]/_/g')_${SHA}"
          IMAGE="${ECR_REGISTRY}/dbaggott/mc-oasis:${TAG}"
          docker tag mc-oasis:ci "$IMAGE"
          # The repository is immutable, so re-running this for a commit that
          # already pushed fails here; push a new commit instead.
          docker push "$IMAGE"
          echo "Pushed $IMAGE"

  # THE ONE CONTEXT BRANCH PROTECTION NAMES (accounts/github/main.tf in
  # dbaggott/infrastructure), so a job starts gating a merge by being added to
  # this `needs:` list. `if: always()` is what keeps a failed dependency from
  # SKIPPING this job, which branch protection would read as success. A skipped
  # dependency is accepted, which is how `push` passes on a pull request.
  ci-required:
    if: always()
    needs: [build, push]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          set -euo pipefail
          echo "needs.*.result = $RESULTS"
          for r in ${RESULTS//,/ }; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::dependency reported '$r'"; exit 1 ;;
            esac
          done
