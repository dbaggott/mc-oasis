################################################################################
# CI — build and test the three things this repo ships: the arm64 server image,
# the website (web/) and the website's API (api/). Outside pull requests,
# publish all three under one tag, <sanitized-branch>_<sha>: both images to ECR,
# the website to the operations release bucket.
#
# PUBLISHING IS NOT DEPLOYING. In dbaggott/infrastructure, `apps/app deploy
# mc-oasis <branch>` records an image for the server, which runs it from its
# next start; `mc-oasis-api` swaps the API's image into its Lambda; and
# `mc-oasis-site` copies the website's release into the site. AWS_ROLE_ARN,
# AWS_REGION, ECR_REGISTRY and RELEASES_BUCKET are repo variables set from
# there (accounts/github/mc_oasis_ci.tf).
#
# Third-party actions are pinned to commit SHAs: this repo is public, and a
# moved tag would run someone else's code with this workflow's permissions.
################################################################################

name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Publishes a branch's build, for `apps/app deploy <app> <branch>`.
  # Dispatchable once this file is on the default branch; a dispatched run uses
  # the chosen branch's copy, publish job included, so anyone who can push a
  # branch decides what runs with the publish role.
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR supersedes the run in flight for it. Every other run gets a
# group of its own commit, since each publishes a distinct build.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    # The server runs on Graviton, so the image is built and tested natively.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q shellcheck; }
          shellcheck scripts/*.sh

      - name: Fetch and verify artifacts
        run: scripts/fetch-artifacts.sh

      - name: Build
        run: docker build --platform linux/arm64 --tag mc-oasis:ci .

      - name: Smoke test
        run: |
          command -v jq >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q jq; }
          scripts/smoke-test.sh mc-oasis:ci

      # Handed to the publish job as a file, so what gets pushed is the image
      # that was tested here rather than a rebuild of it.
      - name: Save the image
        if: github.event_name != 'pull_request'
        run: docker save mc-oasis:ci | gzip > image.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          name: image
          path: image.tar.gz
          retention-days: 1
          compression-level: 0

  # The website under web/, deployed as the mc-oasis-site app.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix web

      - name: Build
        run: npm run build --prefix web

      - name: Check the build
        run: npm test --prefix web

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          name: site
          path: web/dist
          retention-days: 1

  # The website's API under api/, deployed as the mc-oasis-api app: an arm64
  # container-image Lambda.
  api:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix api

      - name: Test
        run: npm test --prefix api

      - name: Build the image
        env:
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          docker build --platform linux/arm64 -f api/Dockerfile \
            --build-arg "NODE_VERSION=$(awk '/^node /{print $2}' .tool-versions)" \
            --build-arg "BUILD_BRANCH=${BRANCH}" \
            --build-arg "BUILD_COMMIT=${SHA}" \
            --build-arg "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag mc-oasis-api:ci .

      - name: Save the image
        if: github.event_name != 'pull_request'
        run: docker save mc-oasis-api:ci | gzip > api-image.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          name: api-image
          path: api-image.tar.gz
          retention-days: 1
          compression-level: 0

  # The only job that can reach AWS. The publish role trusts the `publish`
  # environment and nothing else in this repo, and this job must keep running
  # only on push and workflow_dispatch, never on anything a fork can trigger.
  publish:
    needs: [server, site, api]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: api-image

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: site

      - name: Load the images
        run: |
          gunzip --stdout image.tar.gz | docker load
          gunzip --stdout api-image.tar.gz | docker load

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region "${{ vars.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "${{ vars.ECR_REGISTRY }}"

      - name: Push the images
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The tag apps/app resolves a branch to, sanitized the same way.
          TAG="$(printf '%s' "$BRANCH" | sed 's/[^a-zA-Z0-9._-]/_/g')_${SHA}"
          # The repositories are immutable, so re-running this for a commit
          # that already pushed fails here; push a new commit instead.
          push() {
            docker tag "$1" "$2"
            docker push "$2"
            echo "Pushed $2"
          }
          push mc-oasis:ci "${ECR_REGISTRY}/dbaggott/mc-oasis:${TAG}"
          push mc-oasis-api:ci "${ECR_REGISTRY}/dbaggott/mc-oasis-api:${TAG}"

      - name: Publish the website
        env:
          RELEASES_BUCKET: ${{ vars.RELEASES_BUCKET }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="$(printf '%s' "$BRANCH" | sed 's/[^a-zA-Z0-9._-]/_/g')_${SHA}"
          DEST="s3://${RELEASES_BUCKET}/mc-oasis-site/${TAG}"

          # Vite content-hashes everything under assets/, so a changed file
          # arrives at a new URL and a cached one never needs revalidating.
          aws s3 cp site/assets "${DEST}/assets" --recursive --only-show-errors \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp site "${DEST}" --recursive --exclude "assets/*" --only-show-errors \
            --cache-control "no-cache"

          # Last, because a deploy treats its presence as the release being
          # complete, and the live site serving it as the deploy having landed.
          jq -n --arg release "$TAG" --arg commit "$SHA" '{release: $release, commit: $commit}' > release.json
          aws s3 cp release.json "${DEST}/release.json" --only-show-errors \
            --content-type application/json --cache-control "no-cache"

          echo "Published ${DEST}/"

  # THE ONE CONTEXT BRANCH PROTECTION NAMES (accounts/github/main.tf in
  # dbaggott/infrastructure), so a job starts gating a merge by being added to
  # this `needs:` list. `if: always()` is what keeps a failed dependency from
  # SKIPPING this job, which branch protection would read as success. A skipped
  # dependency is accepted, which is how `publish` passes on a pull request.
  ci-required:
    if: always()
    needs: [server, site, api, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          set -euo pipefail
          echo "needs.*.result = $RESULTS"
          for r in ${RESULTS//,/ }; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::dependency reported '$r'"; exit 1 ;;
            esac
          done
